name: Build and Release ESP8266 Firmware

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache PlatformIO
      uses: actions/cache@v3
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-pio

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio

    - name: Build firmware (ESP8266)
      run: pio run -e nodemcuv2

    - name: Build LittleFS filesystem image (ESP8266)
      run: pio run -t buildfs -e nodemcuv2

    - name: Build firmware (ESP32)
      run: pio run -e esp32dev

    - name: Build LittleFS filesystem image (ESP32)
      run: pio run -t buildfs -e esp32dev

    - name: Prepare release files
      run: |
        mkdir release
        cp .pio/build/nodemcuv2/firmware.bin release/firmware_esp8266.bin
        cp .pio/build/nodemcuv2/littlefs.bin release/littlefs_esp8266.bin
        cp .pio/build/esp32dev/firmware.bin release/firmware_esp32.bin
        cp .pio/build/esp32dev/littlefs.bin release/littlefs_esp32.bin

    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: release/*
      env:
        GITHUB_TOKEN: ${{ secrets.ghtoken }}
